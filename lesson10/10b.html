<!DOCTYPE html>
<html>
<head>
<style>
.row{
  display:flex;
  align-items:center;
  width:350px;
  margin:10px;
}
img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
}
.info{
  margin-left:10px;
}
button{
  margin-left:auto;
  background:#4285f4;
  color:white;
  border:0;
  padding:7px 12px;
}
</style>
</head>
<body>

<div class="row">
  <img src="cat.jpg">
  <div class="info">
    <b>oliver</b><br>
    <span>the cat</span><br>
    <small>Popular</small>
  </div>
  <button>Follow</button>
</div>

<div class="row">
  <img src="cat2.jpg">
  <div class="info">
    <b>Mimi</b><br>
    <span>Sleepy cat</span><br>
    <small>Popular</small>
  </div>
  <button>Follow</button>
</div>

<div class="row">
  <img src="dog.jpg">
  <div class="info">
    <b>Rex</b><br>
    <span>Happy dog</span><br>
    <small>Popular</small>
  </div>
  <button>Follow</button>
</div>

</body>
</html>
