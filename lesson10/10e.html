<!DOCTYPE html>
<html>
<head>
<style>
.container{
  display:flex;
  gap:15px;
}
.card{
  width:160px;
  border:1px solid #ddd;
}
.card img{
  width:100%;
  height:150px;
  object-fit:cover;
}
.info{
  padding:8px;
}
button{
  background:#4285f4;
  color:white;
  border:0;
  padding:6px 10px;
}
</style>
</head>
<body>

<div class="container">

  <div class="card">
    <img src="cat.jpg">
    <div class="info">
      <b>Oliver</b><br>
      <small>2 mutual friends</small><br><br>
      <button>Add Friend</button>
    </div>
  </div>

  <div class="card">
    <img src="cat2.jpg">
    <div class="info">
      <b>Mimi</b><br>
      <small>3 mutual friends</small><br><br>
      <button>Add Friend</button>
    </div>
  </div>

  <div class="card">
    <img src="dog.jpg">
    <div class="info">
      <b>Rex</b><br>
      <small>4 mutual friends</small><br><br>
      <button>Add Friend</button>
    </div>
  </div>

</div>

</body>
</html>
