<!DOCTYPE html>
<html>
<head>
<style>
.google{
  text-align:center;
  width:500px;
  padding:30px;
}
.logo{
  font-size:45px;
  color:#4285f4;
}
input{
  width:350px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:20px;
}
button{
  margin:15px 5px;
  padding:8px 15px;
  border:0;
}
</style>
</head>
<body>

<div class="google">
  <div class="logo">Google</div>

  <input placeholder="Search Google or type a URL">

  <div>
    <button>Google Search</button>
    <button>I'm Feeling Lucky</button>
  </div>
</div>

</body>
</html>
