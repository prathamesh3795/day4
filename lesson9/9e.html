<!DOCTYPE html>
<html>
<head>
<style>
.box{
  width:350px;
  padding:10px;
  border:1px solid #ddd;
  box-shadow:0 2px 5px #aaa;
  display:flex;
  align-items:center;
  gap:10px;
}
img{
  width:40px;
  height:40px;
  border-radius:50%;
}
button{
  margin-left:auto;
  background:#4285f4;
  color:white;
  border:0;
  padding:6px 12px;
}
</style>
</head>
<body>

<div class="box">
  <img src="cat.jpg">
  <span>What's happening?</span>
  <button>Tweet</button>
</div>

</body>
</html>
